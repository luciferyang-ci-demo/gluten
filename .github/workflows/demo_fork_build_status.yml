# Demo of apache/gluten#13535: update_fork_build_status.yml from that PR, with the
# repository check pointed at this repository. The script is checked out from the
# PR's commit, unchanged.
name: Update fork build status (demo)

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'luciferyang-ci-demo/gluten'
    runs-on: ubuntu-slim
    permissions:
      actions: read
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          repository: LuciferYang/gluten
          ref: 71946091b017bcc333fc84f67bab811e0fb961a0
          sparse-checkout: .github/workflows/util/update-fork-build-status.js
          sparse-checkout-cone-mode: false
      - uses: actions/github-script@v9
        with:
          script: |
            const script = require(`${process.env.GITHUB_WORKSPACE}/.github/workflows/util/update-fork-build-status.js`)
            await script({ github, context, core })
